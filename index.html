<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE_ECLIPSE // AUDIO_CONSTRUCT ///</title>
    <style>
        /* --- CORE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- CRT & GLITCH EFFECTS --- */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* --- BACKGROUND CANVAS --- */
        #visualizer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- INTERFACE OVERLAY --- */
        .interface-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: grid;
            grid-template-rows: 80px 1fr 180px;
            padding: 20px;
            pointer-events: none;
        }

        .interface-grid * {
            pointer-events: auto;
        }

        /* --- HEADER SYSTEM --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ff0055;
            padding-bottom: 10px;
        }

        .glitch-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 0 #ff0055, -2px 0 #00ffff;
            letter-spacing: 3px;
            animation: title-noise 4s infinite linear alternate-reverse;
        }

        .system-status {
            font-size: 11px;
            color: #00ffff;
            text-align: right;
            text-transform: uppercase;
        }

        /* --- CENTER CORE (MATRIX / GEOMETRY ARCHITECT) --- */
        .center-matrix {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .geometry-node {
            width: 120px;
            height: 120px;
            border: 1px solid rgba(255, 0, 85, 0.3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .geometry-node::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border: 1px double #00ffff;
            animation: spin-forward 8s linear infinite;
        }

        .geometry-node::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 50%;
            border: 1px dashed #ff0055;
            animation: spin-backward 4s linear infinite;
        }

        /* --- CYBER TERMINAL COMPONENT --- */
        .terminal-box {
            width: 320px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ff0055;
            padding: 12px;
            font-size: 11px;
            color: #ff0055;
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }

        .terminal-line {
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .terminal-line.cyan { color: #00ffff; }
        .terminal-line.white { color: #ffffff; }

        /* --- CONTROL PANEL (BOTTOM) --- */
        .control-panel {
            background: rgba(5, 5, 5, 0.9);
            border: 1px solid #ff0055;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.1);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .mode-selectors {
            display: flex;
            gap: 5px;
        }

        /* --- INDUSTRIAL BUTTONS --- */
        .cyber-btn {
            background: transparent;
            color: #ff0055;
            border: 1px solid #ff0055;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
        }

        .cyber-btn::before {
            content: '[ ';
            left: 4px;
        }
        .cyber-btn::after {
            content: ' ]';
            right: 4px;
        }

        .cyber-btn:hover, .cyber-btn.active {
            background: #ff0055;
            color: #000;
            box-shadow: 0 0 15px #ff0055;
            font-weight: bold;
        }

        .cyber-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }

        .cyber-btn-cyan {
            color: #00ffff;
            border-color: #00ffff;
        }
        .cyber-btn-cyan:hover {
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }

        #audio-upload {
            display: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin-forward {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-backward {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes title-noise {
            0% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; }
            50% { text-shadow: -1px 0 #ff0055, 3px 0 #00ffff; }
            98% { text-shadow: -1px 0 #ff0055, 3px 0 #00ffff; }
            99% { text-shadow: 10px 0 #ff0055, -10px 0 #00ffff; transform: scaleY(1.1); }
            100% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; }
        }
    </style>
</head>
<body>

    <!-- VISUAL ENGINE -->
    <canvas id="visualizer"></canvas>

    <!-- SYNDICATE STRUCTURE OVERLAY -->
    <div class="interface-grid">
        
        <!-- TOP DECK -->
        <header>
            <div class="glitch-title">SYNDICATE // ECLIPSE.AUDIO</div>
            <div class="system-status" id="sys-status">
                CORE_STATUS: IDLE<br>
                <span style="color:#ff0055">FREQUENCY_TARGET: NULL</span>
            </div>
        </header>

        <!-- MID DECK (PERIPHERAL MODULES) -->
        <div class="center-matrix">
            <div class="geometry-node" id="left-node"></div>
            
            <!-- REALTIME CONSOLE LOG -->
            <div class="terminal-box" id="terminal">
                <div class="terminal-line cyan">>>> INITIALIZING ECLIPSE ENGINE...</div>
                <div class="terminal-line">>>> WAITING FOR SIGNAL INPUT...</div>
            </div>
            
            <div class="geometry-node" id="right-node"></div>
        </div>

        <!-- BOTTOM DECK (OPERATIONS) -->
        <div class="control-panel">
            <div class="panel-row">
                <div>
                    <label for="audio-upload" class="cyber-btn cyber-btn-cyan">MOUNT_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="play-pause" class="cyber-btn" disabled>EXECUTE_SIGNAL</button>
                </div>
                <div class="system-status" id="track-name">NO_FILE_LOADED</div>
            </div>
            
            <div class="panel-row" style="border-top: 1px dashed rgba(255, 0, 85, 0.4); padding-top: 10px;">
                <div class="mode-selectors">
                    <button class="cyber-btn mode-btn active" data-mode="0">LINE_RAVE</button>
                    <button class="cyber-btn mode-btn" data-mode="1">CYBER_CIRCLE</button>
                    <button class="cyber-btn mode-btn" data-mode="2">STROBE_MATRIX</button>
                    <button class="cyber-btn mode-btn" data-mode="3">PARTICLE_DUST</button>
                </div>
                <div style="font-size: 10px; color: rgba(255,255,255,0.4)">SYSTEM_v2.0.26 // CLEAN_JS</div>
            </div>
        </div>

    </div>

    <!-- AUDIO CORE NODE -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <!-- LOGIC SYSTEM -->
    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        const uploadInput = document.getElementById('audio-upload');
        const playBtn = document.getElementById('play-pause');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const terminal = document.getElementById('terminal');
        const sysStatus = document.getElementById('sys-status');
        const trackNameDisplay = document.getElementById('track-name');
        const leftNode = document.getElementById('left-node');
        const rightNode = document.getElementById('right-node');

        let audioContext, analyser, source;
        let dataArray, bufferLength;
        let isPlaying = false;
        let currentMode = 0;
        let animationId;

        // Terminal logger
        function log(text, type = '') {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.innerText = `>>> ${text}`;
            terminal.appendChild(line);
            if (terminal.children.length > 8) {
                terminal.removeChild(terminal.children[0]);
            }
        }

        // Window configuration
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio System Core
        function initAudioEngine() {
            if (audioContext) return;
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; // Превосходное разрешение полос
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            log('AUDIO_CONTEXT GENERATED SUCCESSFULLY.', 'cyan');
        }

        // File Handler
        uploadInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const objectURL = URL.createObjectURL(file);
                audioPlayer.src = objectURL;
                playBtn.disabled = false;
                trackNameDisplay.innerText = file.name.toUpperCase();
                log(`MOUNTED: ${file.name.slice(0, 20)}...`, 'white');
                
                initAudioEngine();
                if (audioContext.state === 'suspended') audioContext.resume();
                audioPlayer.play();
                isPlaying = true;
                sysStatus.innerHTML = `CORE_STATUS: RUNNING<br><span style="color:#00ffff">FREQUENCY_TARGET: ACTIVE</span>`;
                render();
            }
        });

        // Trigger Controls
        playBtn.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            
            if (isPlaying) {
                audioPlayer.pause();
                log('SIGNAL EXECUTION SUSPENDED.');
                sysStatus.innerHTML = `CORE_STATUS: PAUSED<br><span style="color:#ff0055">FREQUENCY_TARGET: HALT</span>`;
            } else {
                audioPlayer.play();
                log('SIGNAL EXECUTION RESUMED.', 'cyan');
                sysStatus.innerHTML = `CORE_STATUS: RUNNING<br><span style="color:#00ffff">FREQUENCY_TARGET: ACTIVE</span>`;
                if (!animationId) render();
            }
            isPlaying = !isPlaying;
        });

        // Mode Controller
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                modeBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = parseInt(e.target.dataset.mode);
                log(`SWITCHED INTERFACE MODE TO: [${e.target.innerText}]`, 'cyan');
            });
        });

        // Particle Class Engine
        class DustParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 3 + 0.5;
                this.radius = Math.random() * 2 + 0.5;
                this.color = Math.random() > 0.5 ? '#ff0055' : '#00ffff';
            }
            update(mod) {
                this.x += Math.cos(this.angle) * this.speed * (1 + mod * 0.08);
                this.y += Math.sin(this.angle) * this.speed * (1 + mod * 0.08);
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        const particleSystem = Array.from({ length: 200 }, () => new DustParticle());

        // Master Animation Loop
        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            analyser.getByteFrequencyData(dataArray);

            // Частотные группы для деформации окружения
            let bass = 0, mid = 0, high = 0;
            for(let i = 0; i < 8; i++) bass += dataArray[i];
            for(let i = 8; i < 40; i++) mid += dataArray[i];
            for(let i = 40; i < 100; i++) high += dataArray[i];
            bass /= 8; mid /= 32; high /= 60;

            // Интерактивная деформация интерфейса (фигуры крутятся и масштабируются от баса)
            const scaleFactor = 1 + (bass / 255);
            leftNode.style.transform = `scale(${scaleFactor})`;
            rightNode.style.transform = `scale(${scaleFactor})`;
            leftNode.style.borderColor = bass > 180 ? '#00ffff' : 'rgba(255, 0, 85, 0.3)';
            rightNode.style.borderColor = bass > 180 ? '#00ffff' : 'rgba(255, 0, 85, 0.3)';

            // Контроль стирания кадров
            if (currentMode === 3) {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (currentMode !== 2) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Системы визуализации спектра
            switch (currentMode) {
                case 0: // LINE_RAVE (Зеркальные бары)
                    const step = (canvas.width / bufferLength) * 1.5;
                    let posX = cx;
                    let negX = cx;

                    for (let i = 0; i < bufferLength; i++) {
                        const h = (dataArray[i] / 255) * (canvas.height * 0.4);
                        
                        const gradient = ctx.createLinearGradient(0, cy - h/2, 0, cy + h/2);
                        gradient.addColorStop(0, '#ff0055');
                        gradient.addColorStop(0.5, '#00ffff');
                        gradient.addColorStop(1, '#ff0055');

                        ctx.fillStyle = gradient;
                        if (dataArray[i] > 200) {
                            ctx.shadowBlur = 10;
                            ctx.shadowColor = '#00ffff';
                        }

                        ctx.fillRect(posX, cy - h/2, step - 3, h);
                        ctx.fillRect(negX - step, cy - h/2, step - 3, h);

                        posX += step;
                        negX -= step;
                        ctx.shadowBlur = 0;
                    }
                    break;

                case 1: // CYBER_CIRCLE
                    const r = 110 + (bass * 0.4);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    for (let i = 0; i < bufferLength; i += 2) {
                        const h = (dataArray[i] / 255) * 140;
                        const angle = (i * Math.PI * 2) / bufferLength;

                        const sx = cx + Math.cos(angle) * r;
                        const sy = cy + Math.sin(angle) * r;
                        const ex = cx + Math.cos(angle) * (r + h);
                        const ey = cy + Math.sin(angle) * (r + h);

                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(ex, ey);
                        ctx.strokeStyle = i % 4 === 0 ? '#ff0055' : '#00ffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    break;

                case 2: // STROBE_MATRIX
                    if (bass > 190) {
                        ctx.fillStyle = `rgba(255, 0, 85, ${(bass - 190) / 65})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else if (high > 120) {
                        ctx.fillStyle = `rgba(0, 255, 255, ${(high - 120) / 135})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    
                    // Центральный осциллограф для структуры
                    ctx.beginPath();
                    for(let i=0; i<bufferLength; i++) {
                        const x = (canvas.width / bufferLength) * i;
                        const y = cy + (dataArray[i] - 128);
                        if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    break;

                case 3: // PARTICLE_DUST
                    particleSystem.forEach(p => {
                        p.update(bass + high);
                        p.draw();
                    });
                    break;
            }
        }
    </script>
</body>
</html>
