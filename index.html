<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE // STAGE_LASERS_V2 ///</title>
    <style>
        /* --- CORE & ESTHETICS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- VISUAL ENGINE --- */
        #visualizer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- INTERFACE GRID --- */
        .interface-grid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interface-grid * { pointer-events: auto; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.4); padding-bottom: 10px;
        }
        .glitch-title {
            font-size: 24px; font-weight: bold; color: #fff;
            text-shadow: 2px 0 #0f0, -2px 0 #ff0055;
            letter-spacing: 4px;
        }
        .system-status { font-size: 11px; color: #0f0; text-align: right; text-transform: uppercase; }

        /* MID DECK - EQ & LOGS */
        .mid-deck {
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-grow: 1; padding: 20px 0;
        }

        /* EQUALIZER HARDWARE PANEL (LEFT) */
        .eq-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #0f0;
            backdrop-filter: blur(5px);
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }
        .eq-label { font-size: 10px; color: #0f0; display: flex; justify-content: space-between;}
        input[type="range"].eq-slider {
            -webkit-appearance: none; width: 120px; height: 2px; background: #333; outline: none;
        }
        input[type="range"].eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 6px; height: 16px; background: #0f0; cursor: pointer;
            box-shadow: 0 0 8px #0f0;
        }

        /* SYSTEM TERMINAL (RIGHT) */
        .terminal-container {
            width: 300px; height: 150px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0055;
            backdrop-filter: blur(5px);
            display: flex; flex-direction: column;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }
        .terminal-logs {
            flex-grow: 1; padding: 10px; font-size: 11px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; gap: 4px;
        }
        .term-line { white-space: pre-wrap; word-wrap: break-word; color: #00ffff; }
        .term-line.sys { color: #ff0055; }
        .term-line.info { color: #fff; }

        /* BOTTOM CONTROL PANEL */
        .control-panel {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }
        
        /* TRACK PROGRESS */
        .track-progress-container {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff;
        }
        #track-progress {
            -webkit-appearance: none; flex-grow: 1; height: 2px;
            background: rgba(0, 255, 0, 0.3); outline: none; cursor: pointer;
        }
        #track-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; background: #0f0;
            border-radius: 50%; box-shadow: 0 0 10px #0f0;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .controls-group { display: flex; gap: 5px; flex-wrap: wrap; }

        /* BUTTONS */
        .cyber-btn {
            background: transparent; color: #fff; border: 1px solid #333;
            padding: 8px 12px; font-family: inherit; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .cyber-btn:hover, .cyber-btn.active {
            background: #0f0; color: #000; border-color: #0f0;
            box-shadow: 0 0 15px #0f0; font-weight: bold;
        }
        .cyber-btn:disabled { color: #555; cursor: not-allowed; border-color: #222; }
        .cyber-btn:disabled:hover { background: transparent; box-shadow: none; font-weight: normal; }
        
        .cyber-btn-red { color: #ff0055; border-color: #ff0055; }
        .cyber-btn-red:hover, .cyber-btn-red.active {
            background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055;
        }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div class="interface-grid">
        
        <header>
            <div class="glitch-title">SYNDICATE // STAGE_LASERS</div>
            <div class="system-status" id="track-name">AWAITING_SIGNAL...</div>
        </header>

        <div class="mid-deck">
            <div class="eq-panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#fff">FREQ_CONTROL</div>
                <div class="eq-label"><span>HIGH</span> <span id="val-hi">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-high" min="-20" max="20" value="0">
                <div class="eq-label"><span>MID</span> <span id="val-mid">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-mid" min="-20" max="20" value="0">
                <div class="eq-label"><span>LOW (BASS)</span> <span id="val-low">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-low" min="-20" max="20" value="0">
            </div>

            <div class="terminal-container">
                <div class="terminal-logs" id="term-logs">
                    <div class="term-line sys">>>> SYSTEM INITIALIZED.</div>
                    <div class="term-line sys">>>> DYNAMIC LASER OPTICS: READY.</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="track-progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="track-progress" min="0" max="100" value="0">
                <span id="time-total">00:00</span>
            </div>

            <div class="panel-row">
                <div class="controls-group">
                    <label for="audio-upload" class="cyber-btn cyber-btn-red">LOAD_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="btn-play" class="cyber-btn" disabled>PLAY</button>
                    <button id="btn-pause" class="cyber-btn" disabled>PAUSE</button>
                    <button id="btn-stop" class="cyber-btn" disabled>STOP</button>
                </div>
                <div class="controls-group" id="mode-selectors">
                    <button class="cyber-btn mode-btn active" data-mode="0">CLUB_SCANNERS</button>
                    <button class="cyber-btn mode-btn" data-mode="1">ARENA_SWEEP</button>
                    <button class="cyber-btn mode-btn" data-mode="2">CHAOS_STROBE</button>
                </div>
            </div>
        </div>

    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const trackProgress = document.getElementById('track-progress');
        const termLogs = document.getElementById('term-logs');

        let audioContext, analyser, source;
        let filterLow, filterMid, filterHigh;
        let dataArray, bufferLength;
        let isPlaying = false;
        let currentMode = 0;
        let animationId;

        // Терминал логов
        function tLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `term-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            termLogs.appendChild(line);
            if (termLogs.children.length > 7) termLogs.removeChild(termLogs.children[0]);
        }

        // Конфиг окна
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initProjectors(); // Пересоздаем лазеры под новый размер
        }
        window.addEventListener('resize', resize);

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Инициализация Аудио
        function initAudioEngine() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128; // Нам не нужно много полос для лазеров
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            
            filterLow = audioContext.createBiquadFilter(); filterLow.type = 'lowshelf'; filterLow.frequency.value = 250;
            filterMid = audioContext.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1000; filterMid.Q.value = 1;
            filterHigh = audioContext.createBiquadFilter(); filterHigh.type = 'highshelf'; filterHigh.frequency.value = 4000;

            source.connect(filterLow); filterLow.connect(filterMid); filterMid.connect(filterHigh);
            filterHigh.connect(analyser); analyser.connect(audioContext.destination);

            tLog('AUDIO PIPELINE ONLINE.', 'sys');
        }

        // Привязки UI
        document.getElementById('audio-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('track-name').innerText = file.name;
                btnPlay.disabled = false; btnPause.disabled = false; btnStop.disabled = false;
                tLog(`MOUNTED: ${file.name}`);
            }
        });

        btnPlay.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            audioPlayer.play();
            isPlaying = true;
            if (!animationId) render();
            tLog('EXECUTE: PLAY', 'sys');
        });

        btnPause.addEventListener('click', () => {
            audioPlayer.pause(); isPlaying = false;
            tLog('EXECUTE: PAUSE', 'sys');
        });

        btnStop.addEventListener('click', () => {
            audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tLog('EXECUTE: STOP', 'sys');
        });

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('time-current').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('time-total').innerText = formatTime(audioPlayer.duration);
            if (audioPlayer.duration) trackProgress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        });

        trackProgress.addEventListener('input', (e) => {
            if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
        });

        document.getElementById('eq-low').addEventListener('input', (e) => { if(filterLow) filterLow.gain.value = e.target.value; document.getElementById('val-low').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-mid').addEventListener('input', (e) => { if(filterMid) filterMid.gain.value = e.target.value; document.getElementById('val-mid').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-high').addEventListener('input', (e) => { if(filterHigh) filterHigh.gain.value = e.target.value; document.getElementById('val-hi').innerText = `${e.target.value}dB`; });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = parseInt(e.target.dataset.mode);
                tLog(`STAGE LIGHTING SWITCHED TO MODE [${currentMode}]`, 'sys');
            });
        });

        // --- ДВИЖОК ЛАЗЕРОВ (НОВАЯ АРХИТЕКТУРА) ---

        // Обновленный детектор бита
        let bassHistory = [];
        let beatCutoff = 100; // Установили начальный порог
        function detectBeat(currentBass) {
            bassHistory.push(currentBass);
            if (bassHistory.length > 20) bassHistory.shift();
            
            let avgBass = bassHistory.reduce((a,b) => a+b, 0) / bassHistory.length;
            
            // Если бас резкий - фиксируем бит
            if (currentBass > beatCutoff && currentBass > 150) {
                beatCutoff = currentBass * 1.2;
                return true;
            } else {
                // Мягкое снижение порога: лазеры всегда будут реагировать, даже на тихий бас
                beatCutoff *= 0.92; 
                if (beatCutoff < 100) beatCutoff = 100; // Порог никогда не упадет до нуля
                return false;
            }
        }

        // Класс физического лазера (установки)
        class LaserProjector {
            constructor(x, y, isLeft) {
                this.x = x;
                this.y = y;
                this.isLeft = isLeft;
                this.angle = isLeft ? Math.PI / 4 : (Math.PI * 3) / 4; // Начальный угол
                this.targetAngle = this.angle;
                this.intensity = 0; // Насколько ярко светит (от 0 до 1)
                this.color = '0, 255, 0'; // RGB строка для быстрой вставки
            }

            // Вызывается каждый кадр
            update(isBeat, bassAmount, highAmount) {
                // Плавное движение лазера к цели
                this.angle += (this.targetAngle - this.angle) * 0.15;

                if (isBeat) {
                    // При ударе бита: лазер вспыхивает, меняет цель и цвет
                    this.intensity = 1.0;
                    
                    if (currentMode === 0) { // CLUB_SCANNERS (бьют случайным веером, часто крест-накрест)
                        const base = this.isLeft ? 0 : Math.PI;
                        const spread = Math.random() * (Math.PI / 1.5);
                        this.targetAngle = this.isLeft ? base + spread : base - spread;
                    } 
                    else if (currentMode === 1) { // ARENA_SWEEP (широкие синхронные движения)
                        // Все левые идут в одну сторону, правые в другую
                        this.targetAngle = (Math.PI / 4) + (Math.random() * Math.PI / 2);
                    }
                    else if (currentMode === 2) { // CHAOS_STROBE (дерганные жесткие углы)
                        this.targetAngle = Math.random() * Math.PI * 2;
                        this.angle = this.targetAngle; // Мгновенный перескок, без плавности
                    }

                    // Смена цвета на сильных битах
                    const colors = ['0, 255, 0', '255, 0, 85', '0, 255, 255', '255, 255, 0'];
                    if (Math.random() > 0.6) this.color = colors[Math.floor(Math.random() * colors.length)];
                } else {
                    // В тишине лазер затухает. Чем громче музыка в целом (bassAmount), тем дольше он держится
                    const decay = 0.05 - (bassAmount / 255) * 0.04;
                    this.intensity -= Math.max(0.01, decay);
                    if (this.intensity < 0) this.intensity = 0;
                }

                // В режиме CHAOS добавляем мерцание от высоких частот (hi-hats)
                if (currentMode === 2 && highAmount > 150 && Math.random() > 0.5) {
                    this.intensity = 0.8;
                }
            }

            draw(ctx, maxLength) {
                if (this.intensity <= 0.01) return; // Не рисуем, если выключен

                const endX = this.x + Math.cos(this.angle) * maxLength;
                const endY = this.y - Math.sin(this.angle) * maxLength;

                // Быстрый рендер свечения без laggy shadowBlur
                // 1. Широкое, прозрачное гало
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.15})`;
                ctx.lineWidth = 15;
                ctx.stroke();

                // 2. Средняя сердцевина
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.5})`;
                ctx.lineWidth = 4;
                ctx.stroke();

                // 3. Яркий белый центр (стержень лазера)
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.intensity * 0.9})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        let projectors = [];
        function initProjectors() {
            projectors = [];
            // Создаем 8 лазерных установок: 4 слева, 4 справа (вдоль нижней и боковых кромок)
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            projectors.push(new LaserProjector(w * 0.1, h + 10, true));
            projectors.push(new LaserProjector(w * 0.25, h + 10, true));
            projectors.push(new LaserProjector(w * 0.75, h + 10, false));
            projectors.push(new LaserProjector(w * 0.9, h + 10, false));

            // Боковые прострелы
            projectors.push(new LaserProjector(-10, h * 0.5, true));
            projectors.push(new LaserProjector(-10, h * 0.8, true));
            projectors.push(new LaserProjector(w + 10, h * 0.5, false));
            projectors.push(new LaserProjector(w + 10, h * 0.8, false));
        }
        
        // Первоначальный вызов
        resize(); 

        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

                    // Считаем общую энергию частот
            let bass = 0, high = 0;
            for(let i=0; i<6; i++) bass += dataArray[i]; // Самые низы
            for(let i=40; i<100 && i < dataArray.length; i++) high += dataArray[i]; // Верха
            bass /= 6;
            high /= 60;

            const isBeat = detectBeat(bass);

            // Очистка экрана с эффектом исчезновения старых кадров
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем базовую "сетку" сцены для атмосферы
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.lineWidth = 0.5;
            for(let i = 0; i < canvas.width; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Максимальная длина лазерных лучей
            const maxLength = Math.max(canvas.width, canvas.height) * 1.2;
            
            // Обновляем и рисуем каждый проектор
            projectors.forEach(proj => {
                proj.update(isBeat, bass, high);
                
                // Если нет бита, добавляем фоновое движение (Idle mode)
                if (!isBeat) {
                    proj.targetAngle += (Math.sin(Date.now() / 2000) * 0.01);
                    if (proj.intensity < 0.2) proj.intensity = 0.2; // Лазеры не гаснут полностью
                }
                
                proj.draw(ctx, maxLength);
            });
        }
    </script>
</body>
</html>
