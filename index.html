<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE // LIVE_STAGE_VEER ///</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #visualizer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .interface-grid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interface-grid * { pointer-events: auto; }

        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.4); padding-bottom: 10px;
        }
        .glitch-title {
            font-size: 24px; font-weight: bold; color: #fff;
            text-shadow: 2px 0 #0f0, -2px 0 #ff0055;
            letter-spacing: 4px;
        }
        .system-status { font-size: 11px; color: #0f0; text-align: right; text-transform: uppercase; }

        .mid-deck {
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-grow: 1; padding: 20px 0;
        }

        .eq-panel {
            background: rgba(0, 0, 0, 0.6); border: 1px solid #0f0;
            backdrop-filter: blur(5px); padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .eq-label { font-size: 10px; color: #0f0; display: flex; justify-content: space-between;}
        input[type="range"].eq-slider {
            -webkit-appearance: none; width: 120px; height: 2px; background: #333; outline: none;
        }
        input[type="range"].eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 6px; height: 16px; background: #0f0; cursor: pointer;
        }

        .terminal-container {
            width: 300px; height: 150px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0055;
            backdrop-filter: blur(5px); display: flex; flex-direction: column;
        }
        .terminal-logs {
            flex-grow: 1; padding: 10px; font-size: 11px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; gap: 4px;
        }
        .term-line { white-space: pre-wrap; word-wrap: break-word; color: #00ffff; }
        .term-line.sys { color: #ff0055; }

        .control-panel {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }
        
        .track-progress-container {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff;
        }
        #track-progress {
            -webkit-appearance: none; flex-grow: 1; height: 2px; background: rgba(0, 255, 0, 0.3); outline: none;
        }
        #track-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; background: #0f0; border-radius: 50%;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .controls-group { display: flex; gap: 5px; flex-wrap: wrap; }

        .cyber-btn {
            background: transparent; color: #fff; border: 1px solid #333;
            padding: 8px 12px; font-family: inherit; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .cyber-btn:hover {
            background: #0f0; color: #000; border-color: #0f0; box-shadow: 0 0 15px #0f0; font-weight: bold;
        }
        .cyber-btn:disabled { color: #555; cursor: not-allowed; border-color: #222; }
        
        .cyber-btn-red { color: #ff0055; border-color: #ff0055; }
        .cyber-btn-red:hover { background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055; }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div class="interface-grid">
        <header>
            <div class="glitch-title">SYNDICATE // VEER_STAGE</div>
            <div class="system-status" id="track-name">AWAITING_SIGNAL...</div>
        </header>

        <div class="mid-deck">
            <div class="eq-panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#fff">FREQ_CONTROL</div>
                <div class="eq-label"><span>HIGH</span> <span id="val-hi">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-high" min="-20" max="20" value="0">
                <div class="eq-label"><span>MID</span> <span id="val-mid">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-mid" min="-20" max="20" value="0">
                <div class="eq-label"><span>LOW (BASS)</span> <span id="val-low">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-low" min="-20" max="20" value="0">
            </div>

            <div class="terminal-container">
                <div class="terminal-logs" id="term-logs">
                    <div class="term-line sys">>>> RAVE ENGINE ACTIVATED.</div>
                    <div class="term-line sys">>>> FREQUENCY LINK SYNCED.</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="track-progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="track-progress" min="0" max="100" value="0">
                <span id="time-total">00:00</span>
            </div>

            <div class="panel-row">
                <div class="controls-group">
                    <label for="audio-upload" class="cyber-btn cyber-btn-red">LOAD_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="btn-play" class="cyber-btn" disabled>PLAY</button>
                    <button id="btn-pause" class="cyber-btn" disabled>PAUSE</button>
                    <button id="btn-stop" class="cyber-btn" disabled>STOP</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const trackProgress = document.getElementById('track-progress');
        const termLogs = document.getElementById('term-logs');

        let audioContext, analyser, source, dataArray, bufferLength;
        let filterLow, filterMid, filterHigh;
        let isPlaying = false;
        let animationId;
        let maxLength = 2000;

        function tLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `term-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            termLogs.appendChild(line);
            if (termLogs.children.length > 6) termLogs.removeChild(termLogs.children[0]);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) * 1.2;
            initProjectors(); 
        }
        window.addEventListener('resize', resize);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initAudioEngine() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            
            filterLow = audioContext.createBiquadFilter(); filterLow.type = 'lowshelf'; filterLow.frequency.value = 150;
            filterMid = audioContext.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1000; filterMid.Q.value = 1;
            filterHigh = audioContext.createBiquadFilter(); filterHigh.type = 'highshelf'; filterHigh.frequency.value = 5000;

            source.connect(filterLow); filterLow.connect(filterMid); filterMid.connect(filterHigh);
            filterHigh.connect(analyser); analyser.connect(audioContext.destination);
            tLog('STAGE AUDIO LINK: ESTABLISHED.', 'sys');
        }

        document.getElementById('audio-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('track-name').innerText = file.name;
                btnPlay.disabled = false; btnPause.disabled = false; btnStop.disabled = false;
                tLog(`TRACK READY: ${file.name}`);
            }
        });

        btnPlay.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            audioPlayer.play();
            isPlaying = true;
            if (!animationId) render();
        });

        btnPause.addEventListener('click', () => { audioPlayer.pause(); isPlaying = false; });
        btnStop.addEventListener('click', () => { audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false; ctx.clearRect(0, 0, canvas.width, canvas.height); });

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('time-current').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('time-total').innerText = formatTime(audioPlayer.duration);
            if (audioPlayer.duration) trackProgress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        });

        trackProgress.addEventListener('input', (e) => { if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration; });

        document.getElementById('eq-low').addEventListener('input', (e) => { if(filterLow) filterLow.gain.value = e.target.value; document.getElementById('val-low').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-mid').addEventListener('input', (e) => { if(filterMid) filterMid.gain.value = e.target.value; document.getElementById('val-mid').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-high').addEventListener('input', (e) => { if(filterHigh) filterHigh.gain.value = e.target.value; document.getElementById('val-hi').innerText = `${e.target.value}dB`; });

        // --- УПРАВЛЕНИЕ ЖИВЫМ СЦЕНИЧЕСКИМ ВЕЕРОМ ---
        class StageVeerProjector {
            constructor(x, y, baseAngle, role, color) {
                this.x = x;
                this.y = y;
                this.baseAngle = baseAngle; // Центральное направление пушки
                this.role = role; 
                this.color = color;

                this.currentCenterAngle = baseAngle;
                this.targetCenterAngle = baseAngle;
                
                this.spread = 0;       // Текущая ширина раскрытия веера
                this.targetSpread = 0; // Целевая ширина раскрытия веера
                
                this.intensity = 0;
                this.maxRays = 12;      // Количество лучей в одной пушке
            }

            update(freqs) {
                // Вытаскиваем чистую энергию под каждую роль
                let energy = 0;
                if (this.role === 'LOW') energy = freqs.low;
                else if (this.role === 'MID') energy = freqs.mid;
                else if (this.role === 'HIGH') energy = freqs.high;

                // КРИТИЧЕСКИЙ ХАК НА ПАУЗЫ И КАЖДОЕ СЛОВО:
                // Если частота пустая (тишина/пауза) — мгновенно схлопываем веер в ноль и тушим!
                if (energy < 40) {
                    this.targetSpread = 0.01;
                    this.intensity += (0 - this.intensity) * 0.4; // Мгновенное затухание
                    this.targetCenterAngle = this.baseAngle;
                } else {
                    // Музыка идет: рассчитываем параметры от реальной громкости
                    this.intensity += ((energy / 255) - this.intensity) * 0.3;
                    
                    // Ширина раскрытия веера напрямую зависит от напора частоты!
                    this.targetSpread = (energy / 255) * (Math.PI * 0.4); 

                    // Движение центральной оси веера (Ви-джей крутит ручку от баса и мида)
                    if (this.role === 'LOW' && freqs.low > 140) {
                        this.targetCenterAngle = this.baseAngle + (Math.random() - 0.5) * 0.6;
                    } else if (this.role === 'MID') {
                        // Средние частоты (вокал) плавно качают веер туда-сюда
                        this.targetCenterAngle = this.baseAngle + Math.sin(Date.now() / 400) * 0.4;
                    } else if (this.role === 'HIGH' && freqs.high > 120) {
                        // Высокие частоты заставляют веер резко дергаться
                        this.targetCenterAngle = this.baseAngle + (Math.random() - 0.5) * 0.8;
                    }
                }

                // Плавное сглаживание углов и раскрытия (инерция сервоприводов)
                this.currentCenterAngle += (this.targetCenterAngle - this.currentCenterAngle) * 0.15;
                this.spread += (this.targetSpread - this.spread) * 0.2;
            }

            draw(ctx, maxLength) {
                if (this.intensity < 0.05) return;

                // Отрисовка веера из БАЗОВОЙ ОДНОЙ ТОЧКИ (Разветвление)
                for (let i = 0; i < this.maxRays; i++) {
                    // Распределяем лучи внутри угла раскрытия веера
                    let angleOffset = 0;
                    if (this.maxRays > 1) {
                        angleOffset = (i / (this.maxRays - 1) - 0.5) * this.spread;
                    }
                    
                    let finalAngle = this.currentCenterAngle + angleOffset;

                    const endX = this.x + Math.cos(finalAngle) * maxLength;
                    const endY = this.y - Math.sin(finalAngle) * maxLength;

                    ctx.save();
                    
                    // Эффект объемного дыма и свечения вокруг каждого луча
                    ctx.shadowBlur = 12 * this.intensity;
                    ctx.shadowColor = `rgba(${this.color}, ${this.intensity})`;

                    // 1. Внешний лазерный туман
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.25})`;
                    ctx.lineWidth = 6 * this.intensity; ctx.stroke();

                    // 2. Плотное ядро луча
                    ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.75})`;
                    ctx.lineWidth = 2.5 * this.intensity; ctx.stroke();

                    // 3. Белая вспышка внутри (Plasma Core)
                    ctx.shadowBlur = 2; ctx.shadowColor = '#fff';
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.intensity * 0.95})`;
                    ctx.lineWidth = 0.6 * this.intensity; ctx.stroke();

                    ctx.restore();
                }
            }
        }

        let projectors = [];
        function initProjectors() {
            projectors = [];
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // ЖЕСТКАЯ ГЕОМЕТРИЯ КЛУБА — 4 МОЩНЫХ ИСТОЧНИКА ВЕЕРОВ:
            // 1. Левый нижний басовый веер (LOW)
            projectors.push(new StageVeerProjector(w * 0.1, h + 10, Math.PI / 4, 'LOW', '255, 0, 85'));
            // 2. Правый нижний басовый веер (LOW)
            projectors.push(new StageVeerProjector(w * 0.9, h + 10, (Math.PI * 3) / 4, 'LOW', '255, 0, 85'));
            
            // 3. Левый верхний веер вокала/мелодии (MID)
            projectors.push(new StageVeerProjector(-10, h * 0.2, -Math.PI / 6, 'MID', '0, 230, 255'));
            // 4. Правый верхний веер высоких частот/кликов (HIGH)
            projectors.push(new StageVeerProjector(w + 10, h * 0.2, (Math.PI * 7) / 6, 'HIGH', '0, 255, 120'));
        }

        resize();

        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            analyser.getByteFrequencyData(dataArray);

            let freqs = { low: 0, mid: 0, high: 0 };

            // Собираем частоты без шума
            for(let i = 0; i < 6; i++) freqs.low += dataArray[i];
            freqs.low /= 6;

            for(let i = 12; i < 45; i++) freqs.mid += dataArray[i];
            freqs.mid /= 33;

            for(let i = 50; i < 110; i++) freqs.high += dataArray[i];
            freqs.high /= 60;

            // Стирание кадра со световым клубным шлейфом
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.16)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'screen';

            // Обновляем пушки
            projectors.forEach(proj => {
                proj.update(freqs);
                proj.draw(ctx, maxLength);
            });
        }
    </script>
</body>
</html>
