<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE // HYPER_RAVE_V3_PRO ///</title>
    <style>
        /* --- CORE & ESTHETICS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- VISUAL ENGINE --- */
        #visualizer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- INTERFACE GRID --- */
        .interface-grid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interface-grid * { pointer-events: auto; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.4); padding-bottom: 10px;
        }
        .glitch-title {
            font-size: 24px; font-weight: bold; color: #fff;
            text-shadow: 2px 0 #0f0, -2px 0 #ff0055;
            letter-spacing: 4px;
        }
        .system-status { font-size: 11px; color: #0f0; text-align: right; text-transform: uppercase; }

        /* MID DECK - EQ & LOGS */
        .mid-deck {
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-grow: 1; padding: 20px 0;
        }

        /* EQUALIZER HARDWARE PANEL (LEFT) */
        .eq-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #0f0;
            backdrop-filter: blur(5px);
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }
        .eq-label { font-size: 10px; color: #0f0; display: flex; justify-content: space-between;}
        input[type="range"].eq-slider {
            -webkit-appearance: none; width: 120px; height: 2px; background: #333; outline: none;
        }
        input[type="range"].eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 6px; height: 16px; background: #0f0; cursor: pointer;
            box-shadow: 0 0 8px #0f0;
        }

        /* SYSTEM TERMINAL (RIGHT) */
        .terminal-container {
            width: 300px; height: 150px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0055;
            backdrop-filter: blur(5px);
            display: flex; flex-direction: column;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }
        .terminal-logs {
            flex-grow: 1; padding: 10px; font-size: 11px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; gap: 4px;
        }
        .term-line { white-space: pre-wrap; word-wrap: break-word; color: #00ffff; }
        .term-line.sys { color: #ff0055; }
        .term-line.info { color: #fff; }

        /* BOTTOM CONTROL PANEL */
        .control-panel {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }
        
        /* TRACK PROGRESS */
        .track-progress-container {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff;
        }
        #track-progress {
            -webkit-appearance: none; flex-grow: 1; height: 2px;
            background: rgba(0, 255, 0, 0.3); outline: none; cursor: pointer;
        }
        #track-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; background: #0f0;
            border-radius: 50%; box-shadow: 0 0 10px #0f0;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .controls-group { display: flex; gap: 5px; flex-wrap: wrap; }

        /* BUTTONS */
        .cyber-btn {
            background: transparent; color: #fff; border: 1px solid #333;
            padding: 8px 12px; font-family: inherit; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .cyber-btn:hover, .cyber-btn.active {
            background: #0f0; color: #000; border-color: #0f0;
            box-shadow: 0 0 15px #0f0; font-weight: bold;
        }
        .cyber-btn:disabled { color: #555; cursor: not-allowed; border-color: #222; }
        .cyber-btn:disabled:hover { background: transparent; box-shadow: none; font-weight: normal; }
        
        .cyber-btn-red { color: #ff0055; border-color: #ff0055; }
        .cyber-btn-red:hover, .cyber-btn-red.active {
            background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055;
        }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div class="interface-grid">
        
        <header>
            <div class="glitch-title">SYNDICATE // ADAPTIVE_V3</div>
            <div class="system-status" id="track-name">AWAITING_SIGNAL...</div>
        </header>

        <div class="mid-deck">
            <div class="eq-panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#fff">FREQ_CONTROL</div>
                <div class="eq-label"><span>HIGH</span> <span id="val-hi">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-high" min="-20" max="20" value="0">
                <div class="eq-label"><span>MID</span> <span id="val-mid">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-mid" min="-20" max="20" value="0">
                <div class="eq-label"><span>LOW (BASS)</span> <span id="val-low">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-low" min="-20" max="20" value="0">
            </div>

            <div class="terminal-container">
                <div class="terminal-logs" id="term-logs">
                    <div class="term-line sys">>>> ADAPTIVE ENGINE V3 RE-ENGINEERED.</div>
                    <div class="term-line sys">>>> DYNAMIC LASER ARRAY: 18 CHANNELS READY.</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="track-progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="track-progress" min="0" max="100" value="0">
                <span id="time-total">00:00</span>
            </div>

            <div class="panel-row">
                <div class="controls-group">
                    <label for="audio-upload" class="cyber-btn cyber-btn-red">LOAD_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="btn-play" class="cyber-btn" disabled>PLAY</button>
                    <button id="btn-pause" class="cyber-btn" disabled>PAUSE</button>
                    <button id="btn-stop" class="cyber-btn" disabled>STOP</button>
                </div>
                <div class="controls-group" id="mode-selectors">
                    <button class="cyber-btn mode-btn active" data-mode="0">INTELLIGENT_SHOW</button>
                    <button class="cyber-btn mode-btn" data-mode="1">ARENA_SWEEP</button>
                    <button class="cyber-btn mode-btn" data-mode="2">CHAOS_STROBE</button>
                </div>
            </div>
        </div>

    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const trackProgress = document.getElementById('track-progress');
        const termLogs = document.getElementById('term-logs');

        let audioContext, analyser, source;
        let filterLow, filterMid, filterHigh;
        let dataArray, bufferLength;
        let isPlaying = false;
        let currentMode = 0;
        let animationId;
        let maxLength = 2000;

        function tLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `term-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            termLogs.appendChild(line);
            if (termLogs.children.length > 7) termLogs.removeChild(termLogs.children[0]);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
            initProjectors(); 
        }
        window.addEventListener('resize', resize);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initAudioEngine() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            
            filterLow = audioContext.createBiquadFilter(); filterLow.type = 'lowshelf'; filterLow.frequency.value = 200;
            filterMid = audioContext.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1000; filterMid.Q.value = 1;
            filterHigh = audioContext.createBiquadFilter(); filterHigh.type = 'highshelf'; filterHigh.frequency.value = 5000;

            source.connect(filterLow); filterLow.connect(filterMid); filterMid.connect(filterHigh);
            filterHigh.connect(analyser); analyser.connect(audioContext.destination);

            tLog('HYPER ENGINE ONLINE. ADAPTIVE PROCESSING ACTIVE.', 'sys');
        }

        document.getElementById('audio-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('track-name').innerText = file.name;
                btnPlay.disabled = false; btnPause.disabled = false; btnStop.disabled = false;
                tLog(`MOUNTED: ${file.name}`);
            }
        });

        btnPlay.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            audioPlayer.play();
            isPlaying = true;
            if (!animationId) render();
            tLog('STAGE EXECUTE: PLAY', 'sys');
        });

        btnPause.addEventListener('click', () => {
            audioPlayer.pause(); isPlaying = false;
            tLog('STAGE EXECUTE: PAUSE', 'sys');
        });

        btnStop.addEventListener('click', () => {
            audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tLog('STAGE EXECUTE: STOP', 'sys');
        });

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('time-current').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('time-total').innerText = formatTime(audioPlayer.duration);
            if (audioPlayer.duration) trackProgress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        });

        trackProgress.addEventListener('input', (e) => {
            if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
        });

        document.getElementById('eq-low').addEventListener('input', (e) => { if(filterLow) filterLow.gain.value = e.target.value; document.getElementById('val-low').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-mid').addEventListener('input', (e) => { if(filterMid) filterMid.gain.value = e.target.value; document.getElementById('val-mid').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-high').addEventListener('input', (e) => { if(filterHigh) filterHigh.gain.value = e.target.value; document.getElementById('val-hi').innerText = `${e.target.value}dB`; });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = parseInt(e.target.dataset.mode);
                tLog(`ROUTING CHANGED. ENGINE PATTERN: [${currentMode}]`, 'sys');
            });
        });

        // --- УМНЫЙ ДИНАМИЧЕСКИЙ ДЕТЕКТОР БИТА С АВТОПОДСТРОЙКОЙ ---
        class AdaptiveDetector {
            constructor(ratio = 1.12) {
                this.history = [];
                this.localMax = 50;
                this.ratio = ratio;
                this.decay = 0.98;
            }
            check(currentVal) {
                this.history.push(currentVal);
                if (this.history.length > 25) this.history.shift();
                
                let avg = this.history.reduce((a, b) => a + b, 0) / this.history.length;
                
                // Следим за пиками, чтобы подстроиться под грязный фонк/рэп автоматически
                if (currentVal > this.localMax) this.localMax = currentVal;
                else this.localMax *= this.decay;
                if (this.localMax < 50) this.localMax = 50;

                // Порог теперь "живой" — он зависит от средней громкости трека прямо сейчас
                let adaptiveCutoff = avg * this.ratio;
                if (adaptiveCutoff < 40) adaptiveCutoff = 40; 

                if (currentVal > adaptiveCutoff && currentVal > 50) {
                    return true;
                }
                return false;
            }
        }

        const lowDetector = new AdaptiveDetector(1.1); // Сверхчувствительный для бочки
        const midDetector = new AdaptiveDetector(1.08); // Для основного ритма
        const highDetector = new AdaptiveDetector(1.12); // Для резких хэтов

        class LaserProjector {
            constructor(x, y, isLeft, role, isReserve = false) {
                this.x = x;
                this.y = y;
                this.isLeft = isLeft;
                this.role = role; 
                this.isReserve = isReserve; // Спит ли пушка до жесткого дропа
                
                if (role === 'LOW') {
                    this.angle = isLeft ? Math.PI / 4 : (Math.PI * 3) / 4;
                    this.color = '255, 0, 85'; 
                } else if (role === 'MID') {
                    this.angle = isLeft ? Math.PI / 3 : (Math.PI * 2) / 3;
                    this.color = '0, 255, 255'; 
                } else {
                    this.angle = isLeft ? Math.PI / 6 : (Math.PI * 5) / 6;
                    this.color = '0, 255, 0'; 
                }
                
                this.targetAngle = this.angle;
                this.intensity = 0;
                this.active = !isReserve; // Резервные изначально выключены
            }

            update(frequencies, isLowBeat, isMidBeat, isHighBeat) {
                // Скорость доводки зависит от энергии трека (чем громче, тем резче летают лазеры!)
                let speedFactor = 0.08 + (frequencies.total / 255) * 0.12;
                this.angle += (this.targetAngle - this.angle) * speedFactor;

                // Базовое покачивание
                this.targetAngle += (Math.sin(Date.now() / 1000 + this.x) * 0.001);

                // Если это резервная пушка, она включается только на мощной энергии трека
                if (this.isReserve) {
                    let triggerFreq = this.role === 'LOW' ? frequencies.low : (this.role === 'HIGH' ? frequencies.high : frequencies.mid);
                    if (triggerFreq > 160) {
                        this.active = true;
                    } else if (triggerFreq < 100) {
                        this.active = false;
                        this.intensity *= 0.9;
                        return;
                    }
                }

                if (!this.active) return;

                if (this.role === 'LOW') {
                    if (isLowBeat) {
                        this.intensity = 1.0;
                        // Размах углов зависит от силы баса
                        let sweep = (frequencies.low / 255) * Math.PI;
                        this.targetAngle = this.isLeft ? (Math.random() * sweep * 0.5) : (Math.PI - Math.random() * sweep * 0.5);
                        
                        // Цветовая палитра баса на пиках
                        if (frequencies.low > 200) this.color = '255, 128, 0'; // Оранжевый взрыв
                        else this.color = '255, 0, 85';
                    } else {
                        this.intensity -= 0.02; // Медленное затухание для плотности картинки
                    }
                } 
                
                else if (this.role === 'MID') {
                    if (isMidBeat) {
                        this.intensity = 0.85;
                        // Широкий веер для средних частот
                        this.targetAngle = Math.random() * Math.PI;
                        if (Math.random() > 0.6) this.color = '170, 0, 255'; // Пурпур
                        else this.color = '0, 255, 255';
                    } else {
                        // Постоянное микро-движение от звуковой волны
                        this.targetAngle += (Math.cos(Date.now() / 300) * (frequencies.mid / 255) * 0.02);
                        this.intensity -= 0.03;
                    }
                } 
                
                else if (this.role === 'HIGH') {
                    if (isHighBeat) {
                        this.intensity = 1.0;
                        this.targetAngle = Math.random() * Math.PI;
                        if (currentMode === 2) this.angle = this.targetAngle; // Жесткий стробоскопический срыв
                        this.color = Math.random() > 0.4 ? '0, 255, 0' : '255, 255, 255';
                    } else {
                        this.intensity -= 0.08; // Мгновенно тухнут, создавая эффект вспышки
                    }
                }

                // Увеличили минимальную яркость, чтобы сцена не казалась пустой и голой!
                if (this.intensity < 0.22) this.intensity = 0.22;
            }

            draw(ctx, maxLength, frequencies) {
                if (!this.active || this.intensity <= 0.01) return;

                const endX = this.x + Math.cos(this.angle) * maxLength;
                const endY = this.y - Math.sin(this.angle) * maxLength;

                // Толщина лучей динамически зависит от громкости частот! Качает музыка — жирнеют лучи!
                let currentFreq = this.role === 'LOW' ? frequencies.low : (this.role === 'HIGH' ? frequencies.high : frequencies.mid);
                let thicknessMultiplier = 0.5 + (currentFreq / 255) * 2.0;

                let baseWidth = 3 * thicknessMultiplier;
                if (this.role === 'LOW') baseWidth = 6 * thicknessMultiplier;
                if (this.role === 'HIGH') baseWidth = 1.5 * thicknessMultiplier;

                // 1. Внешний неоновый шлейф
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.12})`;
                ctx.lineWidth = baseWidth * 4.5; ctx.stroke();

                // 2. Основное тело лазера
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.65})`;
                ctx.lineWidth = baseWidth; ctx.stroke();

                // 3. Белая плазменная нить внутри
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.intensity * 0.95})`;
                ctx.lineWidth = baseWidth * 0.2; ctx.stroke();
            }
        }

        let projectors = [];
        function initProjectors() {
            projectors = [];
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // --- БАТАРЕЯ ИЗ 18 ЛАЗЕРНЫХ УСТАНОВОК (РАСПРЕДЕЛЕНИЕ ПО ВСЕЙ СЦЕНЕ) ---
            
            // Основная группа (работают всегда)
            // LOW (Нижний басовый центр)
            projectors.push(new LaserProjector(w * 0.35, h + 10, true, 'LOW'));
            projectors.push(new LaserProjector(w * 0.5, h + 10, true, 'LOW'));
            projectors.push(new LaserProjector(w * 0.65, h + 10, false, 'LOW'));

            // MID (Нижние углы и бока)
            projectors.push(new LaserProjector(w * 0.15, h + 10, true, 'MID'));
            projectors.push(new LaserProjector(w * 0.85, h + 10, false, 'MID'));
            projectors.push(new LaserProjector(-10, h * 0.5, true, 'MID'));
            projectors.push(new LaserProjector(w + 10, h * 0.5, false, 'MID'));

            // HIGH (Верхние углы и боковые прострелы)
            projectors.push(new LaserProjector(-10, h * 0.15, true, 'HIGH'));
            projectors.push(new LaserProjector(w + 10, h * 0.15, false, 'HIGH'));
            projectors.push(new LaserProjector(-10, h * 0.8, true, 'HIGH'));
            projectors.push(new LaserProjector(w + 10, h * 0.8, false, 'HIGH'));
            projectors.push(new LaserProjector(w * 0.5, -10, true, 'HIGH')); // Потолочный пулемет

            // --- УДАРНАЯ ГРУППА РЕЗЕРВА (ВЫЛЕЗАЮТ ПО МЕРЕ НАРАСТАНИЯ МЕЛОДИИ НА ДРОПАХ) ---
            projectors.push(new LaserProjector(w * 0.25, h + 10, true, 'LOW', true));  // Скрытый бас 1
            projectors.push(new LaserProjector(w * 0.75, h + 10, false, 'LOW', true)); // Скрытый бас 2
            
            projectors.push(new LaserProjector(-10, h * 0.35, true, 'MID', true));     // Скрытый мид 1
            projectors.push(new LaserProjector(w + 10, h * 0.35, false, 'MID', true));    // Скрытый мид 2

            projectors.push(new LaserProjector(w * 0.25, -10, true, 'HIGH', true));    // Потолочный резерв 1
            projectors.push(new LaserProjector(w * 0.75, -10, false, 'HIGH', true));   // Потолочный резерв 2
        }
        
        resize(); 

        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            analyser.getByteFrequencyData(dataArray);

            let freqData = { low: 0, mid: 0, high: 0, total: 0 };

            // Собираем частоты с расширенными диапазонами для плотности
            for(let i = 0; i < 10; i++) freqData.low += dataArray[i];
            freqData.low /= 10;

            for(let i = 12; i < 55; i++) freqData.mid += dataArray[i];
            freqData.mid /= 43;

            for(let i = 55; i < 140; i++) freqData.high += dataArray[i];
            freqData.high /= 85;

            // Общая энергия трека
            freqData.total = (freqData.low + freqData.mid + freqData.high) / 3;

            // Проверяем биты по адаптивным порогам
            const isLowBeat = lowDetector.check(freqData.low);
            const isMidBeat = midDetector.check(freqData.mid);
            const isHighBeat = highDetector.check(freqData.high);

            // Очистка экрана с регулируемым шлейфом исчезновения кадров
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.28)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'screen';

            // Обновляем и рендерим всю армию лазеров
            projectors.forEach(proj => {
                proj.update(freqData, isLowBeat, isMidBeat, isHighBeat);
                proj.draw(ctx, maxLength, freqData);
            });
        }
    </script>
</body>
</html>
