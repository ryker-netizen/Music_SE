<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE // FREQ_SPLIT_LASERS_PRO ///</title>
    <style>
        /* --- CORE & ESTHETICS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- VISUAL ENGINE --- */
        #visualizer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- INTERFACE GRID --- */
        .interface-grid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interface-grid * { pointer-events: auto; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.4); padding-bottom: 10px;
        }
        .glitch-title {
            font-size: 24px; font-weight: bold; color: #fff;
            text-shadow: 2px 0 #0f0, -2px 0 #ff0055;
            letter-spacing: 4px;
        }
        .system-status { font-size: 11px; color: #0f0; text-align: right; text-transform: uppercase; }

        /* MID DECK - EQ & LOGS */
        .mid-deck {
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-grow: 1; padding: 20px 0;
        }

        /* EQUALIZER HARDWARE PANEL (LEFT) */
        .eq-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #0f0;
            backdrop-filter: blur(5px);
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }
        .eq-label { font-size: 10px; color: #0f0; display: flex; justify-content: space-between;}
        input[type="range"].eq-slider {
            -webkit-appearance: none; width: 120px; height: 2px; background: #333; outline: none;
        }
        input[type="range"].eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 6px; height: 16px; background: #0f0; cursor: pointer;
            box-shadow: 0 0 8px #0f0;
        }

        /* SYSTEM TERMINAL (RIGHT) */
        .terminal-container {
            width: 300px; height: 150px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0055;
            backdrop-filter: blur(5px);
            display: flex; flex-direction: column;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }
        .terminal-logs {
            flex-grow: 1; padding: 10px; font-size: 11px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; gap: 4px;
        }
        .term-line { white-space: pre-wrap; word-wrap: break-word; color: #00ffff; }
        .term-line.sys { color: #ff0055; }
        .term-line.info { color: #fff; }

        /* BOTTOM CONTROL PANEL */
        .control-panel {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }
        
        /* TRACK PROGRESS */
        .track-progress-container {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff;
        }
        #track-progress {
            -webkit-appearance: none; flex-grow: 1; height: 2px;
            background: rgba(0, 255, 0, 0.3); outline: none; cursor: pointer;
        }
        #track-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; background: #0f0;
            border-radius: 50%; box-shadow: 0 0 10px #0f0;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .controls-group { display: flex; gap: 5px; flex-wrap: wrap; }

        /* BUTTONS */
        .cyber-btn {
            background: transparent; color: #fff; border: 1px solid #333;
            padding: 8px 12px; font-family: inherit; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .cyber-btn:hover, .cyber-btn.active {
            background: #0f0; color: #000; border-color: #0f0;
            box-shadow: 0 0 15px #0f0; font-weight: bold;
        }
        .cyber-btn:disabled { color: #555; cursor: not-allowed; border-color: #222; }
        .cyber-btn:disabled:hover { background: transparent; box-shadow: none; font-weight: normal; }
        
        .cyber-btn-red { color: #ff0055; border-color: #ff0055; }
        .cyber-btn-red:hover, .cyber-btn-red.active {
            background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055;
        }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div class="interface-grid">
        
        <header>
            <div class="glitch-title">SYNDICATE // FREQ_PRO</div>
            <div class="system-status" id="track-name">AWAITING_SIGNAL...</div>
        </header>

        <div class="mid-deck">
            <div class="eq-panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#fff">FREQ_CONTROL</div>
                <div class="eq-label"><span>HIGH</span> <span id="val-hi">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-high" min="-20" max="20" value="0">
                <div class="eq-label"><span>MID</span> <span id="val-mid">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-mid" min="-20" max="20" value="0">
                <div class="eq-label"><span>LOW (BASS)</span> <span id="val-low">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-low" min="-20" max="20" value="0">
            </div>

            <div class="terminal-container">
                <div class="terminal-logs" id="term-logs">
                    <div class="term-line sys">>>> STAGE CONTROLLER ONLINE.</div>
                    <div class="term-line sys">>>> FREQUENCY CHANNELS LOADED.</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="track-progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="track-progress" min="0" max="100" value="0">
                <span id="time-total">00:00</span>
            </div>

            <div class="panel-row">
                <div class="controls-group">
                    <label for="audio-upload" class="cyber-btn cyber-btn-red">LOAD_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="btn-play" class="cyber-btn" disabled>PLAY</button>
                    <button id="btn-pause" class="cyber-btn" disabled>PAUSE</button>
                    <button id="btn-stop" class="cyber-btn" disabled>STOP</button>
                </div>
                <div class="controls-group" id="mode-selectors">
                    <button class="cyber-btn mode-btn active" data-mode="0">INTELLIGENT_SHOW</button>
                    <button class="cyber-btn mode-btn" data-mode="1">ARENA_SWEEP</button>
                    <button class="cyber-btn mode-btn" data-mode="2">CHAOS_STROBE</button>
                </div>
            </div>
        </div>

    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const trackProgress = document.getElementById('track-progress');
        const termLogs = document.getElementById('term-logs');

        let audioContext, analyser, source;
        let filterLow, filterMid, filterHigh;
        let dataArray, bufferLength;
        let isPlaying = false;
        let currentMode = 0;
        let animationId;
        let maxLength = 2000;

        function tLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `term-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            termLogs.appendChild(line);
            if (termLogs.children.length > 7) termLogs.removeChild(termLogs.children[0]);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
            initProjectors(); 
        }
        window.addEventListener('resize', resize);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initAudioEngine() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; // Увеличили разрешение до 512 для четкого деления полос
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            
            filterLow = audioContext.createBiquadFilter(); filterLow.type = 'lowshelf'; filterLow.frequency.value = 250;
            filterMid = audioContext.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1000; filterMid.Q.value = 1;
            filterHigh = audioContext.createBiquadFilter(); filterHigh.type = 'highshelf'; filterHigh.frequency.value = 4000;

            source.connect(filterLow); filterLow.connect(filterMid); filterMid.connect(filterHigh);
            filterHigh.connect(analyser); analyser.connect(audioContext.destination);

            tLog('PRO AUDIO PIPELINE ACTIVE.', 'sys');
        }

        document.getElementById('audio-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('track-name').innerText = file.name;
                btnPlay.disabled = false; btnPause.disabled = false; btnStop.disabled = false;
                tLog(`MOUNTED: ${file.name}`);
            }
        });

        btnPlay.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            audioPlayer.play();
            isPlaying = true;
            if (!animationId) render();
            tLog('STAGE EXECUTE: PLAY', 'sys');
        });

        btnPause.addEventListener('click', () => {
            audioPlayer.pause(); isPlaying = false;
            tLog('STAGE EXECUTE: PAUSE', 'sys');
        });

        btnStop.addEventListener('click', () => {
            audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tLog('STAGE EXECUTE: STOP', 'sys');
        });

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('time-current').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('time-total').innerText = formatTime(audioPlayer.duration);
            if (audioPlayer.duration) trackProgress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        });

        trackProgress.addEventListener('input', (e) => {
            if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
        });

        document.getElementById('eq-low').addEventListener('input', (e) => { if(filterLow) filterLow.gain.value = e.target.value; document.getElementById('val-low').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-mid').addEventListener('input', (e) => { if(filterMid) filterMid.gain.value = e.target.value; document.getElementById('val-mid').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-high').addEventListener('input', (e) => { if(filterHigh) filterHigh.gain.value = e.target.value; document.getElementById('val-hi').innerText = `${e.target.value}dB`; });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = parseInt(e.target.dataset.mode);
                tLog(`ROUTING CHANGED. LIGHTS PATTERN: [${currentMode}]`, 'sys');
            });
        });

        // --- ИНТЕЛЛЕКТУАЛЬНЫЙ СВЕТОВОЙ ПРОЦЕССОР (PRO ЧАСТОТЫ) ---

        // Автономные детекторы битов для разных частотных каналов
        class BeatDetector {
            constructor(cutoffMin, ratio) {
                this.history = [];
                this.cutoff = cutoffMin;
                this.cutoffMin = cutoffMin;
                this.ratio = ratio;
            }
            check(currentVal) {
                this.history.push(currentVal);
                if (this.history.length > 20) this.history.shift();
                let avg = this.history.reduce((a,b) => a+b, 0) / this.history.length;
                
                if (currentVal > this.cutoff && currentVal > avg * this.ratio) {
                    this.cutoff = currentVal * 1.12;
                    return true;
                } else {
                    this.cutoff *= 0.95;
                    if (this.cutoff < this.cutoffMin) this.cutoff = this.cutoffMin;
                    return false;
                }
            }
        }

        const lowDetector = new BeatDetector(140, 1.15);
        const midDetector = new BeatDetector(110, 1.12);
        const highDetector = new BeatDetector(90, 1.15);

        class LaserProjector {
            // РОЛЬ: 'LOW' (бас), 'MID' (средние), 'HIGH' (высокие)
            constructor(x, y, isLeft, role) {
                this.x = x;
                this.y = y;
                this.isLeft = isLeft;
                this.role = role; 
                
                // Начальное позиционирование в зависимости от роли
                if (role === 'LOW') {
                    this.angle = isLeft ? Math.PI / 6 : (Math.PI * 5) / 6;
                    this.color = '255, 0, 85'; // Басовые пушки — ядерный неоново-розовый
                } else if (role === 'MID') {
                    this.angle = isLeft ? Math.PI / 4 : (Math.PI * 3) / 4;
                    this.color = '0, 255, 255'; // Средние частоты — ярко-циановый
                } else {
                    this.angle = isLeft ? Math.PI / 3 : (Math.PI * 2) / 3;
                    this.color = '0, 255, 0'; // Высокие — ядовито-зеленый
                }
                
                this.targetAngle = this.angle;
                this.intensity = 0.2;
            }

            update(frequencies) {
                // Плавная доводка углов
                this.angle += (this.targetAngle - this.angle) * 0.12;

                // Медленное фоновое покачивание в режиме ожидания (Idle)
                this.targetAngle += (Math.sin(Date.now() / 1200 + this.x) * 0.002);

                // Отработка ролей в зависимости от частот
                if (this.role === 'LOW') {
                    const isLowBeat = lowDetector.check(frequencies.low);
                    if (isLowBeat) {
                        this.intensity = 1.0; // Максимальная вспышка от бочки
                        
                        if (currentMode === 0 || currentMode === 1) {
                            // Басовые пушки бьют строго веером крест-накрест
                            this.targetAngle = this.isLeft ? (Math.random() * 0.4) : (Math.PI - Math.random() * 0.4);
                        } else if (currentMode === 2) {
                            this.targetAngle = Math.random() * Math.PI;
                            this.angle = this.targetAngle;
                        }
                        
                        // Меняем цвет баса на желтый/красный при перегрузе
                        if (frequencies.low > 220) this.color = '255, 255, 0';
                        else this.color = '255, 0, 85';
                    } else {
                        this.intensity -= 0.03; // Бас затухает плавно, создавая массу
                    }
                } 
                
                else if (this.role === 'MID') {
                    const isMidBeat = midDetector.check(frequencies.mid);
                    // Средние частоты реагируют на вокал и гитары — они постоянно сканируют пространство
                    if (isMidBeat) {
                        this.intensity = 0.85;
                        const baseAngle = this.isLeft ? Math.PI/6 : Math.PI*0.5;
                        this.targetAngle = baseAngle + (Math.random() * Math.PI / 3);
                        
                        if (Math.random() > 0.7) this.color = '255, 0, 255'; // Пурпурный бафф
                        else this.color = '0, 255, 255';
                    } else {
                        // Движение средних частот зависит от громкости мелодии
                        this.targetAngle += (Math.cos(Date.now() / 500) * (frequencies.mid / 255) * 0.01);
                        this.intensity -= 0.04;
                    }
                } 
                
                else if (this.role === 'HIGH') {
                    const isHighBeat = highDetector.check(frequencies.high);
                    // Высокие частоты (хай-хэты, клики) — работают как резкий стробоскоп
                    if (isHighBeat) {
                        this.intensity = 1.0;
                        // Мгновенный хаотичный выстрел в случайную точку
                        this.targetAngle = Math.random() * Math.PI;
                        if (currentMode === 2) this.angle = this.targetAngle; 
                        
                        this.color = Math.random() > 0.5 ? '0, 255, 0' : '255, 255, 255'; // Зеленый или чистый белый свет
                    } else {
                        this.intensity -= 0.12; // Высокие тухнут СВЕРХБЫСТРО, как вспышки стробоскопа!
                    }
                }

                // Ограничитель минимальной яркости, чтобы лучи не исчезали совсем
                if (this.intensity < 0.15) this.intensity = 0.15;
            }

            draw(ctx, maxLength) {
                if (this.intensity <= 0.01) return;

                const endX = this.x + Math.cos(this.angle) * maxLength;
                const endY = this.y - Math.sin(this.angle) * maxLength;

                // Отрисовка луча с адаптивной толщиной (Бас — толстый, Высокие — тонкие иглы)
                let baseWidth = 4;
                if (this.role === 'LOW') baseWidth = 8;
                if (this.role === 'HIGH') baseWidth = 2;

                // 1. Внешнее гало
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.15})`;
                ctx.lineWidth = baseWidth * 4; ctx.stroke();

                // 2. Сердцевина луча
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(${this.color}, ${this.intensity * 0.6})`;
                ctx.lineWidth = baseWidth; ctx.stroke();

                // 3. Белый стержень лазера
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(endX, endY);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.intensity * 0.9})`;
                ctx.lineWidth = baseWidth * 0.25; ctx.stroke();
            }
        }

        let projectors = [];
        function initProjectors() {
            projectors = [];
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // ЖЕСТКОЕ РАСПРЕДЕЛЕНИЕ СЦЕНИЧЕСКИХ ПОЗИЦИЙ И ЧАСТОТНЫХ РОЛЕЙ:
            
            // 1. БАСОВЫЙ ЦЕХ (LOW) — Находятся строго по центру снизу, бьют мощным неоновым веером вверх
            projectors.push(new LaserProjector(w * 0.45, h + 10, true, 'LOW'));
            projectors.push(new LaserProjector(w * 0.55, h + 10, false, 'LOW'));

            // 2. МЕЛОДИЧЕСКИЙ ЦЕХ (MID) — По углам снизу, сканируют весь экран крест-накрест
            projectors.push(new LaserProjector(w * 0.1, h + 10, true, 'MID'));
            projectors.push(new LaserProjector(w * 0.9, h + 10, false, 'MID'));

            // 3. СТРОБОСКОПИЧЕСКИЙ ЦЕХ (HIGH) — Боковые прострелы сверху и снизу, выдают резкие вспышки-иглы
            projectors.push(new LaserProjector(-10, h * 0.2, true, 'HIGH'));
            projectors.push(new LaserProjector(w + 10, h * 0.2, false, 'HIGH'));
            projectors.push(new LaserProjector(-10, h * 0.7, true, 'HIGH'));
            projectors.push(new LaserProjector(w + 10, h * 0.7, false, 'HIGH'));
        }
        
        resize(); 

        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            analyser.getByteFrequencyData(dataArray);

            // МАТЕМАТИЧЕСКАЯ ФИЛЬТРАЦИЯ ПОТОКА ЧАСТОТ (Разделяем бас, мид и хай)
            let freqData = { low: 0, mid: 0, high: 0 };

            // Канал LOW (Бас): индексы 0 - 6 (самый низкий спектр суб-баса и бочки)
            for(let i = 0; i < 6; i++) freqData.low += dataArray[i];
            freqData.low /= 6;

            // Канал MID (СЧ/Вокал): индексы 15 - 45 (основное тело музыки)
            for(let i = 15; i < 45; i++) freqData.mid += dataArray[i];
            freqData.mid /= 30;

            // Канал HIGH (ВЧ/Тарелки): индексы 60 - 120 (цоканье, биты, воздух)
            for(let i = 60; i < 120; i++) freqData.high += dataArray[i];
            freqData.high /= 60;

            // Стирание кадра с глубоким шлейфом
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'screen';

            // Деплой частот в каждый прожектор отдельно
            projectors.forEach(proj => {
                proj.update(freqData);
                proj.draw(ctx, maxLength);
            });
        }
    </script>
</body>
</html>
