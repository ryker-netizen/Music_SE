<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// SYNDICATE // REAL_VOLUMETRIC_RAVE ///</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #visualizer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .interface-grid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .interface-grid * { pointer-events: auto; }

        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.4); padding-bottom: 10px;
        }
        .glitch-title {
            font-size: 24px; font-weight: bold; color: #fff;
            text-shadow: 2px 0 #0f0, -2px 0 #ff0055;
            letter-spacing: 4px;
        }
        .system-status { font-size: 11px; color: #0f0; text-align: right; text-transform: uppercase; }

        .mid-deck {
            display: flex; justify-content: space-between; align-items: flex-end;
            flex-grow: 1; padding: 20px 0;
        }

        .eq-panel {
            background: rgba(0, 0, 0, 0.6); border: 1px solid #0f0;
            backdrop-filter: blur(5px); padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .eq-label { font-size: 10px; color: #0f0; display: flex; justify-content: space-between;}
        input[type="range"].eq-slider {
            -webkit-appearance: none; width: 120px; height: 2px; background: #333; outline: none;
        }
        input[type="range"].eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 6px; height: 16px; background: #0f0; cursor: pointer;
        }

        .terminal-container {
            width: 300px; height: 150px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ff0055;
            backdrop-filter: blur(5px); display: flex; flex-direction: column;
        }
        .terminal-logs {
            flex-grow: 1; padding: 10px; font-size: 11px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; gap: 4px;
        }
        .term-line { white-space: pre-wrap; word-wrap: break-word; color: #00ffff; }
        .term-line.sys { color: #ff0055; }

        .control-panel {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            backdrop-filter: blur(10px);
        }
        
        .track-progress-container {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fff;
        }
        #track-progress {
            -webkit-appearance: none; flex-grow: 1; height: 2px; background: rgba(0, 255, 0, 0.3); outline: none;
        }
        #track-progress::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; background: #0f0; border-radius: 50%;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .controls-group { display: flex; gap: 5px; flex-wrap: wrap; }

        .cyber-btn {
            background: transparent; color: #fff; border: 1px solid #333;
            padding: 8px 12px; font-family: inherit; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .cyber-btn:hover, .cyber-btn.active {
            background: #0f0; color: #000; border-color: #0f0; box-shadow: 0 0 15px #0f0; font-weight: bold;
        }
        .cyber-btn:disabled { color: #555; cursor: not-allowed; border-color: #222; }
        
        .cyber-btn-red { color: #ff0055; border-color: #ff0055; }
        .cyber-btn-red:hover { background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055; }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div class="interface-grid">
        <header>
            <div class="glitch-title">SYNDICATE // VOLUMETRIC</div>
            <div class="system-status" id="track-name">AWAITING_SIGNAL...</div>
        </header>

        <div class="mid-deck">
            <div class="eq-panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color:#fff">STAGE_EQ</div>
                <div class="eq-label"><span>HIGH</span> <span id="val-hi">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-high" min="-20" max="20" value="0">
                <div class="eq-label"><span>MID</span> <span id="val-mid">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-mid" min="-20" max="20" value="0">
                <div class="eq-label"><span>LOW (BASS)</span> <span id="val-low">0dB</span></div>
                <input type="range" class="eq-slider" id="eq-low" min="-20" max="20" value="0">
            </div>

            <div class="terminal-container">
                <div class="terminal-logs" id="term-logs">
                    <div class="term-line sys">>>> SYSTEM ONLINE. FORCING VOLUMETRIC MODE.</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="track-progress-container">
                <span id="time-current">00:00</span>
                <input type="range" id="track-progress" min="0" max="100" value="0">
                <span id="time-total">00:00</span>
            </div>

            <div class="panel-row">
                <div class="controls-group">
                    <label for="audio-upload" class="cyber-btn cyber-btn-red">LOAD_TRACK</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <button id="btn-play" class="cyber-btn" disabled>PLAY</button>
                    <button id="btn-pause" class="cyber-btn" disabled>PAUSE</button>
                    <button id="btn-stop" class="cyber-btn" disabled>STOP</button>
                </div>
                <div class="controls-group" id="mode-selectors">
                    <button class="cyber-btn mode-btn active" data-mode="0">INTELLIGENT_SHOW</button>
                    <button class="cyber-btn mode-btn" data-mode="1">ARENA_SWEEP</button>
                    <button class="cyber-btn mode-btn" data-mode="2">CHAOS_STROBE</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const trackProgress = document.getElementById('track-progress');
        const termLogs = document.getElementById('term-logs');

        let audioContext, analyser, source;
        let filterLow, filterMid, filterHigh;
        let dataArray, bufferLength;
        let isPlaying = false;
        let currentMode = 0;
        let animationId;
        let maxLength = 2000;

        function tLog(text, type = 'info') {
            const line = document.createElement('div');
            line.className = `term-line ${type}`;
            line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            termLogs.appendChild(line);
            if (termLogs.children.length > 6) termLogs.removeChild(termLogs.children[0]);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxLength = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height) * 1.2;
            initProjectors(); 
        }
        window.addEventListener('resize', resize);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initAudioEngine() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; 
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source = audioContext.createMediaElementSource(audioPlayer);
            
            filterLow = audioContext.createBiquadFilter(); filterLow.type = 'lowshelf'; filterLow.frequency.value = 180;
            filterMid = audioContext.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1200; filterMid.Q.value = 1;
            filterHigh = audioContext.createBiquadFilter(); filterHigh.type = 'highshelf'; filterHigh.frequency.value = 6000;

            source.connect(filterLow); filterLow.connect(filterMid); filterMid.connect(filterHigh);
            filterHigh.connect(analyser); analyser.connect(audioContext.destination);
            tLog('VOLUMETRIC ENGINE INJECTED.', 'sys');
        }

        document.getElementById('audio-upload').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                audioPlayer.src = URL.createObjectURL(file);
                document.getElementById('track-name').innerText = file.name;
                btnPlay.disabled = false; btnPause.disabled = false; btnStop.disabled = false;
                tLog(`LOADED: ${file.name}`);
            }
        });

        btnPlay.addEventListener('click', () => {
            initAudioEngine();
            if (audioContext.state === 'suspended') audioContext.resume();
            audioPlayer.play();
            isPlaying = true;
            if (!animationId) render();
        });

        btnPause.addEventListener('click', () => { audioPlayer.pause(); isPlaying = false; });
        btnStop.addEventListener('click', () => { audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false; ctx.clearRect(0, 0, canvas.width, canvas.height); });

        audioPlayer.addEventListener('timeupdate', () => {
            document.getElementById('time-current').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('time-total').innerText = formatTime(audioPlayer.duration);
            if (audioPlayer.duration) trackProgress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        });

        trackProgress.addEventListener('input', (e) => { if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration; });

        document.getElementById('eq-low').addEventListener('input', (e) => { if(filterLow) filterLow.gain.value = e.target.value; document.getElementById('val-low').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-mid').addEventListener('input', (e) => { if(filterMid) filterMid.gain.value = e.target.value; document.getElementById('val-mid').innerText = `${e.target.value}dB`; });
        document.getElementById('eq-high').addEventListener('input', (e) => { if(filterHigh) filterHigh.gain.value = e.target.value; document.getElementById('val-hi').innerText = `${e.target.value}dB`; });

        class DynamicTrack {
            constructor(sensitivity = 1.05) {
                this.avg = 100;
                this.sensitivity = sensitivity;
            }
            isBeat(val) {
                this.avg = this.avg * 0.96 + val * 0.04;
                return val > this.avg * this.sensitivity && val > 45;
            }
        }

        const lowTrack = new DynamicTrack(1.04);
        const midTrack = new DynamicTrack(1.03);
        const highTrack = new DynamicTrack(1.06);

        // --- ОБЪЕМНЫЙ ЛАЗЕРНЫЙ СТОЛБ С ИНЕРЦИЕЙ ---
        class VolumetricLaser {
            constructor(x, y, isLeft, role, index) {
                this.x = x;
                this.y = y;
                this.isLeft = isLeft;
                this.role = role;
                this.index = index;

                this.angle = isLeft ? Math.PI/4 : (Math.PI*3)/4;
                this.targetAngle = this.angle;
                
                // Скорость движения индивидуальна для каждой пушки
                this.angularVelocity = 0;
                this.inertia = 0.82 + (index % 3) * 0.04; 

                this.intensity = 0.2;
                this.targetIntensity = 0.2;

                if (role === 'LOW') this.color = '255, 0, 85';      // Неоновый пурпур/розовый
                else if (role === 'MID') this.color = '0, 240, 255'; // Плотный циан
                else this.color = '0, 255, 100';                    // Кислотно-зеленый
            }

            update(freqs, isLow, isMid, isHigh) {
                // Плавное следование за таргетом через физику углового ускорения
                let accel = (this.targetAngle - this.angle) * 0.15;
                this.angularVelocity = this.angularVelocity * this.inertia + accel;
                this.angle += this.angularVelocity;

                // Медленный живой дрейф сцены в покое
                this.targetAngle += Math.sin(Date.now() / (800 + this.index * 100)) * 0.0015;

                // Реакция на частоты
                if (this.role === 'LOW') {
                    if (isLow) {
                        this.targetIntensity = 1.0;
                        this.targetAngle = this.isLeft ? (Math.random() * 0.9) : (Math.PI - Math.random() * 0.9);
                    } else {
                        this.targetIntensity -= 0.02;
                    }
                } 
                else if (this.role === 'MID') {
                    if (isMid) {
                        this.targetIntensity = 0.85;
                        this.targetAngle = 0.1 + Math.random() * (Math.PI - 0.2);
                    } else {
                        this.targetIntensity -= 0.03;
                    }
                } 
                else if (this.role === 'HIGH') {
                    if (isHigh) {
                        this.targetIntensity = 1.0;
                        this.targetAngle = Math.random() * Math.PI;
                        if (currentMode === 2) this.angle = this.targetAngle; 
                    } else {
                        this.targetIntensity -= 0.07;
                    }
                }

                if (this.targetIntensity < 0.25) this.targetIntensity = 0.25;
                this.intensity += (this.targetIntensity - this.intensity) * 0.2;
            }

            draw(ctx, maxLength, freqs) {
                ctx.save();
                
                // Конечные координаты центральной оси луча
                const endX = this.x + Math.cos(this.angle) * maxLength;
                const endY = this.y - Math.sin(this.angle) * maxLength;

                // Расчет толщины конуса от энергии трека
                let energy = this.role === 'LOW' ? freqs.low : (this.role === 'HIGH' ? freqs.high : freqs.mid);
                let beamWidth = (4 + (energy / 255) * 12) * this.intensity;

                // Перпендикулярные смещения для отрисовки геометрии конуса (лазер расширяется к концу)
                const perpAngle = this.angle + Math.PI / 2;
                const startSpread = beamWidth * 0.2; // У основания пушки луч тонкий
                const endSpread = beamWidth * 3.5;  // Вдали луч рассеивается в конус!

                const startLeftX = this.x + Math.cos(perpAngle) * startSpread;
                const startLeftY = this.y - Math.sin(perpAngle) * startSpread;
                const startRightX = this.x - Math.cos(perpAngle) * startSpread;
                const startRightY = this.y - Math.sin(perpAngle) * startSpread;

                const endLeftX = endX + Math.cos(perpAngle) * endSpread;
                const endLeftY = endY - Math.sin(perpAngle) * endSpread;
                const endRightX = endX - Math.cos(perpAngle) * endSpread;
                const endRightY = endY - Math.sin(perpAngle) * endSpread;

                // ЭФФЕКТ КЛУБНОГО СВЕЧЕНИЯ И СЛОИСТОГО ТУМАНА (Реальный Glow)
                ctx.shadowBlur = beamWidth * 2.5;
                ctx.shadowColor = `rgba(${this.color}, ${this.intensity})`;

                // Слоистый объемный конус света
                let gradient = ctx.createLinearGradient(this.x, this.y, endX, endY);
                gradient.addColorStop(0, `rgba(${this.color}, ${this.intensity * 0.9})`);
                gradient.addColorStop(0.3, `rgba(${this.color}, ${this.intensity * 0.4})`);
                gradient.addColorStop(1, `rgba(${this.color}, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(startLeftX, startLeftY);
                ctx.lineTo(endLeftX, endLeftY);
                ctx.lineTo(endRightX, endRightY);
                ctx.lineTo(startRightX, startRightY);
                ctx.closePath();
                ctx.fill();

                // Яркое белое ядро внутри лазера (Plasma Core)
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#fff';
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.intensity * 0.95})`;
                ctx.lineWidth = Math.max(0.5, beamWidth * 0.15);
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.restore();
            }
        }

        let projectors = [];
        function initProjectors() {
            projectors = [];
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Базовая плотная сцена из 12 мощных объемных установок
            // НИЗ (Тяжелый бас и ритм-секция)
            projectors.push(new VolumetricLaser(w * 0.2, h + 15, true, 'LOW', 0));
            projectors.push(new VolumetricLaser(w * 0.4, h + 15, true, 'LOW', 1));
            projectors.push(new VolumetricLaser(w * 0.6, h + 15, false, 'LOW', 2));
            projectors.push(new VolumetricLaser(w * 0.8, h + 15, false, 'LOW', 3));

            // СТЕНЫ И ПРОСТРЕЛЫ (Середина / Мелодия)
            projectors.push(new VolumetricLaser(-15, h * 0.3, true, 'MID', 4));
            projectors.push(new VolumetricLaser(-15, h * 0.7, true, 'MID', 5));
            projectors.push(new VolumetricLaser(w + 15, h * 0.3, false, 'MID', 6));
            projectors.push(new VolumetricLaser(w + 15, h * 0.7, false, 'MID', 7));

                        // ПОТОЛОК И ВЕРХНИЙ СТРОБОСКОП (Высокие частоты)
            projectors.push(new VolumetricLaser(w * 0.25, -15, true, 'HIGH', 8));
            projectors.push(new VolumetricLaser(w * 0.75, -15, false, 'HIGH', 9));
            projectors.push(new VolumetricLaser(-15, h * 0.1, true, 'HIGH', 10));
            projectors.push(new VolumetricLaser(w + 15, h * 0.1, false, 'HIGH', 11));
        }

        resize();

        function render() {
            if (!isPlaying) { animationId = null; return; }
            animationId = requestAnimationFrame(render);
            
            analyser.getByteFrequencyData(dataArray);

            let freqs = { low: 0, mid: 0, high: 0 };

            for(let i = 0; i < 8; i++) freqs.low += dataArray[i];
            freqs.low /= 8;

            for(let i = 10; i < 50; i++) freqs.mid += dataArray[i];
            freqs.mid /= 40;

            for(let i = 50; i < 110; i++) freqs.high += dataArray[i];
            freqs.high /= 60;

            const isLow = lowTrack.isBeat(freqs.low);
            const isMid = midTrack.isBeat(freqs.mid);
            const isHigh = highTrack.isBeat(freqs.high);

            // КЛЮЧЕВОЙ ХАК: Более плотное затирание кадра для эффекта шлейфа дыма
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'screen';

            projectors.forEach(proj => {
                proj.update(freqs, isLow, isMid, isHigh);
                proj.draw(ctx, maxLength, freqs);
            });
        }
    </script>
</body>
</html>
